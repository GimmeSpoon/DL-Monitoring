<html lang="en">
  <head>
    <title>Server Monitor — Sign in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <script src="vendor/jquery-3.6.3.min.js"></script>
    <script src="common.js"></script>
    <script>
      $(function(){
        $('#brand-mark').html(window.ICONS.signal);
        $('#login-form').on('submit', (evnt)=>{
          evnt.preventDefault();
          $.ajax({
            url: '/api/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ password: $('#pw').val() }),
          })
          .done(()=>{ window.location.href = '/'; })
          .fail(()=>{ $('#login-error').text('Wrong password.'); $('#pw').val('').focus(); });
        });
        $('#pw').focus();
      });
    </script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><span id="brand-mark"></span> Server <span>Monitor</span></span>
      <div class="topbar-right">
        <button id="skin" class="icon-btn" type="button" aria-label="Toggle theme"></button>
      </div>
    </header>

    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <div class="login-error" id="login-error"></div>
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
        <button type="submit" class="login-button">Sign in</button>
      </form>
    </div>
  </body>
</html>
