<html lang="en">
  <head>
    <title>MLLAB Monitor — Logs</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <script src="vendor/jquery-3.6.3.min.js"></script>
    <script src="common.js"></script>
    <script>
      const EVENT_TYPES = ['ssh_connect', 'ssh_disconnect', 'ssh_fail', 'login_ok', 'login_fail', 'kill', 'revive', 'collector_error', 'server_start', 'storage_scan', 'storage_fail'];
      const BAD_TYPES = new Set(['ssh_disconnect', 'ssh_fail', 'login_fail', 'collector_error', 'kill', 'storage_fail']);
      const OK_TYPES = new Set(['ssh_connect', 'login_ok', 'revive', 'server_start', 'storage_scan']);
      const PAGE = { events: 100, usage: 50 };

      const fmtTime = (ts)=>ts ? new Date(ts * 1000).toLocaleString() : '';
      const fmtDuration = (s)=>{
        if(s < 60) return `${s}s`;
        if(s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
        return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
      };
      const esc = (x)=>$('<i>').text(x == null ? '' : x).html();
      let offsets = { events: 0, usage: 0 };

      function typeBadge(type){
        const cls = BAD_TYPES.has(type) ? 'type-bad' : (OK_TYPES.has(type) ? 'type-ok' : '');
        return `<span class="event-type ${cls}">${esc(type)}</span>`;
      }

      function loadEvents(){
        const params = { limit: PAGE.events, offset: offsets.events };
        if($('#ev-server').val()) params.server = $('#ev-server').val();
        if($('#ev-type').val()) params.type = $('#ev-type').val();
        $.getJSON('/api/events', params).done((data)=>{
          $('#ev-rows').html(data.rows.map((r)=>
            `<tr><td>${fmtTime(r.ts)}</td><td>${typeBadge(r.type)}</td><td>${esc(r.server)}</td><td>${esc(r.message)}</td></tr>`
          ).join('') || '<tr><td colspan="4">No events in range</td></tr>');
          renderPager('events', data.total, loadEvents);
        });
      }

      function loadUsage(){
        const params = { limit: PAGE.usage, offset: offsets.usage };
        if($('#us-server').val()) params.server = $('#us-server').val();
        if($('#us-user').val()) params.user = $('#us-user').val().trim();
        if($('#us-active').prop('checked')) params.active = 1;
        $.getJSON('/api/usage', params).done((data)=>{
          $('#us-rows').html(data.rows.map((r)=>{
            const end = r.end_ts || Math.floor(Date.now() / 1000);
            return `<tr>
              <td>${esc(r.server)}</td><td>GPU ${r.gpu_index}</td><td>${window.ICONS.user} ${esc(r.username)}</td>
              <td>${fmtTime(r.start_ts)}</td>
              <td>${r.end_ts ? fmtTime(r.end_ts) : '<span class="event-type type-ok">active</span>'}</td>
              <td>${fmtDuration(Math.max(0, end - r.start_ts))}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="6">No usage records in range</td></tr>');
          renderPager('usage', data.total, loadUsage);
        });
      }

      function renderPager(kind, total, reload){
        const page = PAGE[kind];
        const from = total === 0 ? 0 : offsets[kind] + 1;
        const to = Math.min(offsets[kind] + page, total);
        $(`#${kind}-pager`).html(`
          <button id="${kind}-prev" ${offsets[kind] === 0 ? 'disabled' : ''}>&laquo; Prev</button>
          <span>${from}–${to} of ${total}</span>
          <button id="${kind}-next" ${to >= total ? 'disabled' : ''}>Next &raquo;</button>`);
        $(`#${kind}-prev`).on('click', ()=>{ offsets[kind] = Math.max(0, offsets[kind] - page); reload(); });
        $(`#${kind}-next`).on('click', ()=>{ offsets[kind] += page; reload(); });
      }

      $(function(){
        $('#brand-mark').html(window.ICONS.signal);
        $('#ev-type').html('<option value="">all types</option>' + EVENT_TYPES.map((t)=>`<option>${t}</option>`).join(''));
        populateServers($('#ev-server'), ()=>{
          $('#ev-server').prepend('<option value="" selected>all servers</option>');
          $('#us-server').html($('#ev-server').html());
          loadEvents();
        });
        $('.tab').on('click', function(){
          $('.tab').removeClass('active'); $(this).addClass('active');
          const target = $(this).data('target');
          $('.log-view').hide(); $(`#${target}`).show();
          if(target === 'usage-view') loadUsage(); else loadEvents();
        });
        $('#ev-server, #ev-type').on('change', ()=>{ offsets.events = 0; loadEvents(); });
        $('#us-server, #us-active').on('change', ()=>{ offsets.usage = 0; loadUsage(); });
        $('#us-user').on('keydown', (evnt)=>{ if(evnt.key === 'Enter'){ offsets.usage = 0; loadUsage(); } });
      });
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span id="brand-mark"></span> MLLAB <span>Monitor</span></a>
      <nav id="nav" class="nav"></nav>
      <div class="topbar-right">
        <button id="skin" class="icon-btn" type="button" aria-label="Toggle theme"></button>
        <a href="#" id="logout" class="logout">Logout</a>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-target="events-view">Events</button>
      <button class="tab" data-target="usage-view">GPU usage</button>
    </div>

    <div class="log-view" id="events-view">
      <div class="controls">
        <label>Server <select id="ev-server"></select></label>
        <label>Type <select id="ev-type"></select></label>
      </div>
      <div class="log-panel">
        <table class="log-table">
          <thead><tr><th>Time</th><th>Type</th><th>Server</th><th>Message</th></tr></thead>
          <tbody id="ev-rows"></tbody>
        </table>
        <div class="pager" id="events-pager"></div>
      </div>
    </div>

    <div class="log-view" id="usage-view" style="display:none">
      <div class="controls">
        <label>Server <select id="us-server"></select></label>
        <label>User <input type="text" id="us-user" placeholder="any user"></label>
        <label><input type="checkbox" id="us-active"> active only</label>
      </div>
      <div class="log-panel">
        <table class="log-table">
          <thead><tr><th>Server</th><th>GPU</th><th>User</th><th>Start</th><th>End</th><th>Duration</th></tr></thead>
          <tbody id="us-rows"></tbody>
        </table>
        <div class="pager" id="usage-pager"></div>
      </div>
    </div>
  </body>
</html>
