<html lang="en">
  <head>
    <title>Server Monitor — Storage</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <script src="vendor/jquery-3.6.3.min.js"></script>
    <script src="common.js"></script>
    <script>
      // green -> red ramp for filesystem fullness (matches the dashboard)
      const thermal = ['#2ea043', '#3fb950', '#d6b02f', '#e0863d', '#f0533f'];
      const pivots = [30, 50, 70, 90];
      const colorFor = (pct)=>{ for(let i = 0; i < pivots.length; i++){ if(pct < pivots[i]) return thermal[i]; } return thermal[4]; };

      function fmt(b){
        if(!Number.isFinite(b)) return '--';
        const u = ['B', 'K', 'M', 'G', 'T', 'P'];
        let i = 0, v = b;
        while(v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
        return `${v >= 100 || i === 0 ? Math.round(v) : Math.round(v * 10) / 10}${u[i]}`;
      }
      const esc = (x)=>$('<i>').text(x == null ? '' : x).html();
      const fmtTime = (ts)=>ts ? new Date(ts * 1000).toLocaleString() : '';
      const sum = (rows)=>rows.reduce((s, r)=>s + (r.bytes || 0), 0);
      const maxTs = (rows)=>rows.reduce((t, r)=>Math.max(t, r.ts || 0), 0);

      // which scan kind fills which section — a section is drawn when it has rows
      // or a target that should be producing them
      const SECTIONS = [
        { id: 'acct', kinds: ['account'], types: ['accounts'], title: 'Account usage' },
        { id: 'cnt', kinds: ['container'], types: ['containers'], title: 'Container usage' },
        { id: 'path', kinds: ['path', 'custom'], types: ['paths', 'command'], title: 'Paths' },
      ];

      // shared name/bar/value row used by every non-container kind
      function bar(icon, name, bytes, max, note){
        return `<div class="acct-row">
          <span class="acct-name" title="${esc(name)}">${icon}${esc(name)}</span>
          <span class="acct-track"><span class="acct-fill" style="width:${max ? bytes / max * 100 : 0}%"></span></span>
          <span class="acct-val">${fmt(bytes)}${note ? ` <em>${esc(note)}</em>` : ''}</span>
        </div>`;
      }

      // a container expands to the storage mounted into it: destination, kind of
      // mount, and the host path the bytes were measured on
      function container(c, max, note){
        const m = c.meta || {};
        // the writable/mounted split lives in the body, not the summary: the value
        // column is a fixed width shared with every other row's, and a two-part
        // breakdown does not fit it
        const parts = [];
        if(m.writable) parts.push(`writable ${fmt(m.writable)}`);
        if(m.mounted) parts.push(`mounted ${fmt(m.mounted)}`);
        const mounts = (c.mounts || []).slice().sort((a, b)=>b.bytes - a.bytes);
        const rows = mounts.map((mt)=>`<div class="mnt-row">
            <span class="mnt-dest" title="${esc(mt.name)}">${esc(mt.name)}</span>
            <span class="mnt-src" title="${esc((mt.meta || {}).source)}">${esc((mt.meta || {}).type || '')} ${esc((mt.meta || {}).source || '')}${(mt.meta || {}).shared > 1 ? ` · shared ×${(mt.meta || {}).shared}` : ''}</span>
            <span class="mnt-val">${fmt(mt.bytes)}</span>
          </div>`).join('');
        const info = [parts.length ? `<div class="mnt-note">${parts.join(' + ')}</div>` : '',
          m.image ? `<div class="mnt-note">image ${esc(m.image)}</div>` : '',
          m.status ? `<div class="mnt-note">${esc(m.status)}</div>` : ''].join('');
        const body = (rows || info)
          ? `<div class="cnt-mounts">${info}${rows || '<div class="mnt-note">No measured mounts (all excluded, or the mount layer is off).</div>'}</div>`
          : '';
        return `<details class="cnt">
          <summary class="acct-row">
            <span class="acct-name" title="${esc(c.name)}">${window.ICONS.box}${esc(c.name)}</span>
            <span class="acct-track"><span class="acct-fill" style="width:${max ? c.bytes / max * 100 : 0}%"></span></span>
            <span class="acct-val">${fmt(c.bytes)}${note ? ` <em>${esc(note)}</em>` : ''}</span>
          </summary>${body}
        </details>`;
      }

      function renderSection(sec, d){
        const rows = sec.kinds.flatMap((k)=>(d.kinds || {})[k] || []);
        const targets = (d.targets || []).filter((t)=>sec.types.includes(t.type));
        const $box = $(`#sec-${sec.id}`);
        if(!rows.length && !targets.length){ $box.hide(); return; }
        $box.show();

        const failing = targets.find((t)=>t.ok === false);
        if(!rows.length){
          $(`#${sec.id}-list`).empty();
          $(`#${sec.id}-meta`).text('');
          $(`#${sec.id}-empty`).text(failing
            ? `Last scan failed: ${failing.error}`
            : (targets.some((t)=>t.ts) ? 'The last scan found nothing here.' : 'No scan has completed yet — the first runs shortly after startup.'));
          return;
        }

        const total = sum(rows);
        const max = Math.max(...rows.map((r)=>r.bytes || 0), 1);
        // rows outlive a failed scan, so say so — otherwise the last good numbers read as current
        $(`#${sec.id}-empty`).text(failing ? `Last scan failed: ${failing.error} — showing the last successful scan.` : '');
        $(`#${sec.id}-list`).html(rows.map((r)=>{
          const share = `${(total ? r.bytes / total * 100 : 0).toFixed(1)}%`;
          if(r.kind === 'container') return container(r, max, share);
          const icon = r.kind === 'account' ? window.ICONS.user : window.ICONS.folder;
          return bar(icon, r.name, r.bytes, max, share);
        }).join(''));
        $(`#${sec.id}-meta`).text(`${rows.length} · ${fmt(total)} · scanned ${fmtTime(maxTs(rows))}`);
      }

      // per-target health: a target that has been failing for days otherwise just
      // looks like a section with no data
      function renderTargets(d){
        const targets = d.targets || [];
        if(!targets.length){ $('#sec-scan').hide(); return; }
        $('#sec-scan').show();
        $('#scan-rows').html(targets.map((t)=>{
          const state = t.ok === null ? 'pending' : (t.ok ? 'ok' : 'failed');
          const detail = t.ok === false ? t.error
            : (t.ok ? `${t.entries} entries · ${fmt(t.bytes)} · ${(t.ms / 1000).toFixed(1)}s${t.method ? ` · ${t.method}` : ''}` : 'not run yet');
          return `<tr>
            <td>${esc(t.label)}</td>
            <td class="scan-conn">${esc(t.connection)}</td>
            <td><span class="scan-state ${state}">${state}</span></td>
            <td class="scan-detail" title="${esc(detail)}">${esc(detail)}</td>
            <td>${t.ts ? esc(fmtTime(t.ts)) : '--'}</td>
            <td>${t.every_hours}h</td>
          </tr>`;
        }).join(''));
      }

      function render(d){
        // filesystems
        $('#fs-rows').html((d.mounts || []).map((m)=>{
          const free = (m.total || 0) - (m.used || 0);
          const pct = m.total ? m.used / m.total * 100 : 0;
          return `<tr>
            <td>${esc(m.mount)}</td>
            <td>${fmt(m.total)}</td>
            <td>${fmt(m.used)}</td>
            <td>${fmt(free)}</td>
            <td class="use-cell">
              <span class="cellbar"><span class="cellbar-fill" style="width:${Math.min(100, pct)}%;background:${colorFor(pct)}"></span></span>
              <span class="use-pct">${Math.round(pct)}%</span>
            </td>
          </tr>`;
        }).join('') || '<tr><td colspan="5">No filesystem data for this server</td></tr>');

        for(const sec of SECTIONS) renderSection(sec, d);
        renderTargets(d);
      }

      // one status line for both buttons. `from` marks who wrote it, so the 30s
      // poll can clear its own stale error without wiping a scan's result
      function note(msg, from){ $('#note').text(msg).data('from', from || ''); }

      // a failed fetch used to render as empty panels, which reads exactly like
      // "this server has no storage" — the one thing it does not mean
      function load(server){
        if(!server) return;
        $.getJSON('/api/storage', { server })
          .done((d)=>{ if($('#note').data('from') === 'load') note(''); render(d); })
          .fail((x)=>note(`could not load ${server}: ${(x.responseJSON || {}).error || x.status}`, 'load'));
      }

      // force every target of this scope to run now. A du walk can take minutes,
      // so the button stays busy until the server answers.
      function scanNow(){
        const $b = $('#scan-now'), server = $('#server-select').val();
        if(!server || $b.prop('disabled')) return;
        $b.addClass('spin').prop('disabled', true);
        note('scanning...');
        $.post(`/api/storage/scan?server=${encodeURIComponent(server)}`)
          // ran:false means a pass was already in flight and this click measured
          // nothing — otherwise the numbers look freshly scanned when they are not
          .done((r)=>{
            const ts = r.targets || [], bad = ts.filter((t)=>t.ok === false);
            note(!r.ran ? 'a scan was already running' : `scanned ${ts.length} targets${bad.length ? ` · ${bad.length} failed` : ''}`);
          })
          .fail((x)=>note(`scan failed: ${(x.responseJSON || {}).error || x.status}`))
          .always(()=>{ $b.removeClass('spin').prop('disabled', false); load(server); });
      }

      // re-read storage.json without a restart. Scopes and targets can both change,
      // so the whole dropdown is rebuilt rather than just the panels.
      function reloadConfig(){
        const $b = $('#reload');
        if($b.prop('disabled')) return;
        $b.addClass('spin').prop('disabled', true);
        $.post('/api/config/reload')
          .done((r)=>note(`${r.storage.targets} targets from ${r.storage.source}`))
          .fail((x)=>note(`reload failed: ${(x.responseJSON || {}).error || x.status}`))
          .always(()=>{ $b.removeClass('spin').prop('disabled', false); loadScopes($('#server-select').val()); });
      }

      function loadScopes(want){
        $.getJSON('/api/storage/scopes').done((data)=>{
          const scopes = data.scopes || [];
          // only a monitored server can be known to be down; a scan-only scope
          // has no poll behind it, so it gets no badge either way
          $('#server-select').html(scopes.map((s)=>
            `<option value="${s.name}">${s.name}${s.online === false ? ' (offline)' : ''}</option>`).join(''));
          const sel = (want && scopes.some((s)=>s.name === want)) ? want : (scopes[0] && scopes[0].name);
          if(sel){ $('#server-select').val(sel); load(sel); }
        });
      }

      $(function(){
        $('#brand-mark').html(window.ICONS.signal);
        $('#scan-now').html(window.ICONS.refresh + 'Scan now').on('click', scanNow);
        $('#reload').on('click', reloadConfig);
        loadScopes(new URLSearchParams(window.location.search).get('server'));
        $('#server-select').on('change', function(){ load(this.value); });
        setInterval(()=>load($('#server-select').val()), 30000);
      });
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span id="brand-mark"></span> Server <span>Monitor</span></a>
      <nav id="nav" class="nav"></nav>
      <div class="topbar-right">
        <button id="skin" class="icon-btn" type="button" aria-label="Toggle theme"></button>
        <a href="#" id="logout" class="logout">Logout</a>
      </div>
    </header>

    <div class="controls">
      <label>Server <select id="server-select"></select></label>
      <button id="scan-now" class="range-btn" type="button" title="Measure this server's storage now instead of waiting for the interval (a du walk can take minutes)"></button>
      <button id="reload" class="range-btn" type="button" title="Re-read configs/storage.json and configs/services.json from disk">Reload config</button>
      <span id="note" class="status-note"></span>
    </div>

    <div class="storage-wrap">
      <section class="panel">
        <h3>Filesystems</h3>
        <table class="log-table">
          <thead><tr><th>Mount</th><th>Size</th><th>Used</th><th>Free</th><th>Use</th></tr></thead>
          <tbody id="fs-rows"></tbody>
        </table>
      </section>

      <section class="panel" id="sec-acct">
        <h3>Account usage <span id="acct-meta"></span></h3>
        <div id="acct-list"></div>
        <div class="storage-note" id="acct-empty"></div>
      </section>

      <section class="panel" id="sec-cnt">
        <h3>Container usage <span id="cnt-meta"></span></h3>
        <div id="cnt-list"></div>
        <div class="storage-note" id="cnt-empty"></div>
      </section>

      <section class="panel" id="sec-path">
        <h3>Paths <span id="path-meta"></span></h3>
        <div id="path-list"></div>
        <div class="storage-note" id="path-empty"></div>
      </section>

      <section class="panel" id="sec-scan">
        <h3>Scan targets</h3>
        <table class="log-table">
          <thead><tr><th>Target</th><th>Connection</th><th>State</th><th>Last result</th><th>Ran</th><th>Every</th></tr></thead>
          <tbody id="scan-rows"></tbody>
        </table>
      </section>
    </div>
  </body>
</html>
